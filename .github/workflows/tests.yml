name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    name: Parser tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run parser tests
        run: python -m unittest discover -s tests
